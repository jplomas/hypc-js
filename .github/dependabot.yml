version: 2
# CI gates only the runtime tree (npm audit --omit=dev); dev-tree advisories are tracked here.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: "development"
    ignore:
      # typescript-eslint, which neostandard uses, supports TypeScript below 6.1. Remove this when
      # its typescript peer range allows newer versions.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
      # @types/node tracks the oldest Node.js line in package.json's engines, not the newest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
